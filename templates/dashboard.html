<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Wetter-Dashboard</title>
</head>
<body>
    <h1>Wetter Berlin</h1>

    {% if aktuell %}
    <div class="row mb-4">
        <div class="col">Temperatur: <strong>{{ aktuell.temperature }} °C</strong></div>
        <div class="col">Niederschlag: <strong>{{ aktuell.precipitation }} mm</strong></div>
        <div class="col">Wind: <strong>{{ aktuell.wind_speed }} km/h</strong></div>
    </div>
    {% endif %}
    
    <p>
    <a href="/?days=1">24 Stunden</a> |
    <a href="/?days=3">3 Tage</a> |
    <a href="/?days=7">7 Tage</a>
</p>
<p>{{ anzahl }} Einträge (letzte {{ days }} Tage)</p>

    <canvas id="tempChart" width="800" height="400"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script>
        const labels = {{ labels|tojson }};
        const temperaturen = {{ temperaturen|tojson }};
        const niederschlag = {{ niederschlag|tojson }};
        const wind = {{ wind|tojson }};

        new Chart(document.getElementById("tempChart"), {
            type: "line",
            data: {
                labels: labels,
                datasets: [{
                    label: "Temperatur (°C)",
                    data: temperaturen,
                    borderColor: "#d9534f",
                     tension: 0.3
                }, {
                    label: "Niederschlag (mm)",
                    data: niederschlag,
                    borderColor: "#0275d8",
                    tension: 0.3
                }, {
                    label: "Wind (km/h)",
                    data: wind,
                    borderColor: "#5cb85c",
                    tension: 0.3
                }]
            }
        });
    </script>
</body>
</html>
